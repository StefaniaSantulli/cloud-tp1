<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AccesoSeguro{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root{
    --azul-oscuro:#0F1E3D;
    --azul-medio:#2954C8;
    --bg:#F7F8FA;
    --card:#FFFFFF;
    --texto:#0F1E3D;
    --texto-sec:#6B7280;
    --icon-bg:#EEF2FF;
    --sombra:0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(15,30,61,0.06);
    --sombra-hover:0 2px 6px rgba(0,0,0,0.08), 0 18px 40px rgba(15,30,61,0.14);
    --verde:#16A34A;
    --rojo:#DC2626;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--texto);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1100px;margin:0 auto;padding-left:1.5rem;padding-right:1.5rem}

  .navbar-custom{background-color:var(--azul-oscuro);padding:1rem 0}
  .navbar-custom .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem}
  .navbar-brand-custom{color:#fff;font-weight:800;font-size:1.25rem;text-decoration:none;letter-spacing:-.01em}
  .navbar-links{display:flex;flex-wrap:wrap;gap:.35rem}
  .navbar-links a{
    color:rgba(255,255,255,.75);text-decoration:none;font-size:.85rem;font-weight:600;
    padding:.45rem .8rem;border-radius:8px;transition:background .2s ease, color .2s ease;white-space:nowrap;
  }
  .navbar-links a:hover{background:rgba(255,255,255,.1);color:#fff}

  .page-header{padding:2.5rem 0 1.5rem}
  .page-header h1{font-size:1.85rem;font-weight:800;margin:0 0 .35rem;letter-spacing:-.02em}
  .page-header p{color:var(--texto-sec);margin:0;font-size:.98rem}

  .content{padding-bottom:4rem}

  .panel-card{background:var(--card);border-radius:16px;padding:2rem;box-shadow:var(--sombra)}

  label{font-weight:600;font-size:.85rem;color:var(--texto);margin-bottom:.35rem;display:block}
  .form-control, .form-select{border-radius:8px;border:1px solid #E2E5EA;padding:.6rem .85rem;font-size:.95rem}
  .form-control:focus, .form-select:focus{border-color:var(--azul-medio);box-shadow:0 0 0 3px rgba(41,84,200,.15)}
  .mb-field{margin-bottom:1.25rem}

  .btn-primary-custom{background:var(--azul-oscuro);border:none;color:#fff;font-weight:600;font-size:.92rem;padding:.65rem 1.5rem;border-radius:8px;transition:background .2s ease}
  .btn-primary-custom:hover{background:#16294F;color:#fff}

  .btn-approve{background:var(--verde);border:none;color:#fff;font-weight:600;font-size:.85rem;padding:.5rem 1.1rem;border-radius:8px}
  .btn-approve:hover{background:#128a3e;color:#fff}
  .btn-reject{background:var(--rojo);border:none;color:#fff;font-weight:600;font-size:.85rem;padding:.5rem 1.1rem;border-radius:8px;margin-left:.4rem}
  .btn-reject:hover{background:#b91c1c;color:#fff}

  .alert-success-custom{background:#EAF7EE;border:1px solid #BEE8CB;color:#0B4F2A;border-radius:10px;padding:1rem 1.25rem;font-size:.92rem;font-weight:600}

  .result-box{border-radius:12px;padding:1.5rem;margin-top:1.5rem}
  .result-ok{background:#EAF7EE;border:1px solid #BEE8CB}
  .result-fail{background:#FDECEC;border:1px solid #F5C2C2}
  .result-box h3{font-size:1.1rem;font-weight:800;margin:0 0 .75rem}
  .result-ok h3{color:#0B4F2A}
  .result-fail h3{color:#7A1F1F}
  .result-box p{margin:.15rem 0;font-size:.92rem;color:var(--texto)}
  .result-box p b{color:var(--texto-sec);font-weight:600}

  table.custom-table{width:100%;border-collapse:collapse;font-size:.9rem}
  table.custom-table thead th{text-align:left;color:var(--texto-sec);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:.75rem .9rem;border-bottom:2px solid #EEF0F3}
  table.custom-table tbody td{padding:.85rem .9rem;border-bottom:1px solid #EEF0F3;vertical-align:middle}
  table.custom-table tbody tr:hover{background:#FAFBFC}

  .badge-estado{display:inline-block;padding:.3rem .7rem;border-radius:999px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .badge-pendiente{background:#FEF3E2;color:#92400E}
  .badge-aprobada{background:#EAF7EE;color:#0B4F2A}
  .badge-rechazada{background:#FDECEC;color:#7A1F1F}
  .badge-vencida{background:#F1F1F3;color:#4B5563}

  .empty-state{text-align:center;padding:3rem 1rem;color:var(--texto-sec)}
  .link-doc{color:var(--azul-medio);font-weight:600;text-decoration:none;font-size:.85rem}
  .link-doc:hover{text-decoration:underline}

  .list-clean{list-style:none;margin:0;padding:0}
  .list-clean li{background:var(--card);border-radius:10px;padding:.9rem 1.1rem;margin-bottom:.6rem;box-shadow:var(--sombra);font-size:.9rem}
  .list-clean li .meta{color:var(--texto-sec);font-size:.78rem;margin-bottom:.15rem}

  .site-footer{border-top:1px solid #E5E7EB;padding:2rem 0;margin-top:1rem}
  .site-footer p{margin:0;font-size:.875rem;color:var(--texto-sec)}

  @media (max-width:767.98px){.navbar-custom .wrap{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>

<nav class="navbar-custom">
  <div class="wrap">
    <a class="navbar-brand-custom" href="/">AccesoSeguro</a>
    <div class="navbar-links">
      <a href="/nueva-solicitud">Nueva solicitud</a>
      <a href="/panel-aprobacion">Aprobación</a>
      <a href="/verificacion">Verificación</a>
      <a href="/reporte">Reporte</a>
      <a href="/auditoria">Auditoría</a>
      <a href="/solicitudes">Todas</a>
    </div>
  </div>
</nav>

<div class="content">
  <div class="wrap">
    <div class="page-header">
      <h1>{% block page_title %}{% endblock %}</h1>
      <p>{% block page_subtitle %}{% endblock %}</p>
    </div>
    {% block content %}{% endblock %}
  </div>
</div>

<footer class="site-footer">
  <div class="wrap"><p>AccesoSeguro — Sistema de control de acceso a plantas industriales</p></div>
</footer>

</body>
</html>
