<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva solicitud de acceso</title>
</head>
<body>
    <h1>Solicitud de autorización de ingreso</h1>
    <form method="POST">
        <label>Nombre completo:</label><br>
        <input type="text" name="nombre_solicitante" required><br><br>

        <label>DNI:</label><br>
        <input type="text" name="dni" required><br><br>

        <label>Patente (si aplica):</label><br>
        <input type="text" name="patente"><br><br>

        <label>Empresa:</label><br>
        <input type="text" name="empresa"><br><br>

        <label>Motivo de la visita:</label><br>
        <input type="text" name="motivo"><br><br>

        <label>Sede:</label><br>
        <select name="sede_id">
            {% for sede in sedes %}
                <option value="{{ sede.id }}">{{ sede.nombre }}</option>
            {% endfor %}
        </select><br><br>

        <button type="submit">Enviar solicitud</button>
    </form>

    {% if mensaje %}
        <p><strong>{{ mensaje }}</strong></p>
    {% endif %}
</body>
</html>
